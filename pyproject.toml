[project]
name = "rag-based-future-ready-telecom-ran-assistant"
version = "0.1.0"
description = "TelecomRAG — domain-specific RAG system for Telecom RAN: 3GPP Q&A, root cause analysis, anomaly detection, and network optimization."
readme = "README.MD"
requires-python = ">=3.10"
dependencies = [
    # Core LLM & RAG
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-huggingface>=0.0.10",
    "langchain-docling>=0.1.0",
    # Embeddings & Vector Store
    "huggingface-hub>=0.17.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    # Document Processing
    "python-docx>=0.8.11",
    "docling>=1.0.0",
    "docx2txt>=0.9",
    "pypdf>=3.0.0",
    # LLM Inference
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "bitsandbytes>=0.41.0",
    "peft>=0.6.0",
    "groq>=0.4.0",
    # Hybrid Retrieval
    "rank-bm25>=0.2.2",
    # Web API
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    # Evaluation
    "ragas>=0.0.18",
    "scikit-learn>=1.3.0",
    "datasets>=2.14.0",
    # Utilities
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "jsonlines>=4.0.0",
    # Demo UI
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
